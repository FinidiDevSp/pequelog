name: pequelog
description: "Bitacora digital para peques."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_native_splash:
  color: "#FBFBF1"
  color_dark: "#3F4C5A"
  image: assets/logo.png
  image_dark: assets/logo.png
  android_12:
    color: "#FBFBF1"
    color_dark: "#3F4C5A"
    image: assets/logo.png
    image_dark: assets/logo.png
  ios_content_mode: center
  android_gravity: center
